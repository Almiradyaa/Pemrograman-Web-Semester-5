<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180" role="img" aria-labelledby="diagramTitle diagramDesc" xmlns:c2pa="http://c2pa.org/manifest">
  <metadata>
    <c2pa:manifest></c2pa:manifest>
  </metadata>
  <title id="diagramTitle">Diagram Alur Metodologi Riset</title>
  <desc id="diagramDesc">Alur lima tahap: Identifikasi Masalah, Studi Literatur, Pengumpulan Data, Analisis Data, Penyusunan Kesimpulan.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a71930"></path>
    </marker>
  </defs>

  <g font-family="Georgia, 'Times New Roman', Times, serif" font-size="13" text-anchor="middle">
    <!-- Kotak 1 -->
    <rect x="10" y="60" width="130" height="60" rx="8" fill="#f2a900" stroke="#a71930" stroke-width="2"></rect>
    <text x="75" y="86" fill="#222222">Identifikasi</text>
    <text x="75" y="102" fill="#222222">Masalah</text>

    <!-- Kotak 2 -->
    <rect x="170" y="60" width="130" height="60" rx="8" fill="#f2a900" stroke="#a71930" stroke-width="2"></rect>
    <text x="235" y="86" fill="#222222">Studi</text>
    <text x="235" y="102" fill="#222222">Literatur</text>

    <!-- Kotak 3 -->
    <rect x="330" y="60" width="130" height="60" rx="8" fill="#f2a900" stroke="#a71930" stroke-width="2"></rect>
    <text x="395" y="86" fill="#222222">Pengumpulan</text>
    <text x="395" y="102" fill="#222222">Data</text>

    <!-- Kotak 4 -->
    <rect x="490" y="60" width="130" height="60" rx="8" fill="#f2a900" stroke="#a71930" stroke-width="2"></rect>
    <text x="555" y="86" fill="#222222">Analisis</text>
    <text x="555" y="102" fill="#222222">Data</text>

    <!-- Kotak 5 (Tinggi 90, Center Y = 90) -->
    <rect x="640" y="45" width="110" height="90" rx="8" fill="#006837" stroke="#a71930" stroke-width="2"></rect>
    <text x="695" y="86" fill="#f9f9f9">Penyusunan</text>
    <text x="695" y="102" fill="#f9f9f9">Kesimpulan</text>

    <!-- Panah Penghubung -->
    <line x1="140" y1="90" x2="168" y2="90" stroke="#a71930" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="300" y1="90" x2="328" y2="90" stroke="#a71930" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="460" y1="90" x2="488" y2="90" stroke="#a71930" stroke-width="2" marker-end="url(#arrow)"></line>
    <line x1="620" y1="90" x2="638" y2="90" stroke="#a71930" stroke-width="2" marker-end="url(#arrow)"></line>
  </g>
</svg>
